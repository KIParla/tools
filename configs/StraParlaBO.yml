# StraParlaBO module — process pipeline configuration.
# Keys not listed here fall back to defaults.yml.

# Token-level variation markers active in this module:
#   #word  → Variation=Token  (specific token is foreign variety)
#   $word  → Variation=Emerging  (non-existent in Italian but potentially so)
#   #*word → Variation=Doubtful  (probably Italian)
#   #_ → from this point to the end of the TU is foreign variety (Variation=Token on each
#        following token); at the start of a TU it covers the whole TU

# Translation tiers are per-speaker child tiers named "<speaker>_trad"
# (e.g. "PSB033_trad") — extract to translations TSV, not ignored.
tiers_to_ignore: []
tiers_to_extract_suffixes:
  - _trad

variation_markers:
  hash_token: true
  dollar: true
  hash_doubtful: true

normalization:
  HASH_UNIT_SPACE: true  # #_ standalone: #_word → #_ word, [#_ w] → #_ [w]
