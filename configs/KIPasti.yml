# KIPasti module — process pipeline configuration.
# Keys not listed here fall back to defaults.yml.

# `#word` marks a word of another code (Code=Other). The unit-initial `# ` needs no flag.
variation_markers:
  hash_token: true

normalization:
  HASH_PREFIX_SPACE: true  # # at start of unit may lack a space: '#word' → '# word'
