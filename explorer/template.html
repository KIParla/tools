<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIParla Corpus Explorer</title>
<link rel="stylesheet" href="explorer.css">
</head>
<body>
<header class="top">
  <div>
    <h1>KIParla Corpus Explorer</h1>
    <p>Filter the conversations of the seven KIParla modules by metadata, speakers and measured features, see what the resulting sub-corpus contains, and export it.</p>
  </div>
  <nav aria-label="Related"><a id="nav-transcriptions" href="#">Transcriptions</a><a id="nav-search" href="#">Search the corpus</a></nav>
</header>

<div class="layout">
  <aside id="filters" aria-label="Filters">
    <div class="fhead">
      <h2>Filters</h2>
      <span>
        <button type="button" id="reset">Reset</button>
        <button type="button" class="ftoggle" id="ftoggle" aria-expanded="false">Show</button>
      </span>
    </div>
    <div class="fbody" id="fbody"></div>
  </aside>

  <main>
    <section class="selbar" id="selbar" aria-live="polite" aria-label="Current selection"></section>
    <div class="chips" id="chips"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="explore" aria-selected="false">Explore</button>
      <button role="tab" data-tab="table" aria-selected="false">Conversations</button>
      <button role="tab" data-tab="export" aria-selected="false">Export</button>
    </div>
    <section class="panel" id="panel" role="tabpanel"></section>
  </main>
</div>
<footer id="foot"></footer>
<div id="tip" role="tooltip"></div>

<script src="core.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
